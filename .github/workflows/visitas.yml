name: Datos de visitas (Web de Preventores)

on:
  # Sin horario propio de GitHub: los horarios programados de GitHub se demoraban
  # horas o se salteaban. La corrida la lanza cron-job.org (lunes a viernes 8:30,
  # 13:30 y 17:30, hora de Buenos Aires) o el botón del celular, con workflow_dispatch.
  workflow_dispatch:
    inputs:
      solo_probar:
        description: "Solo probar (no manda nada, muestra los datos y los avisos en el registro)"
        type: boolean
        default: false
      telegram:
        description: "Mandar también el aviso por Telegram y WhatsApp"
        type: boolean
        default: true

concurrency:
  group: visitas
  cancel-in-progress: false

jobs:
  visitas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Leer la Web de Preventores y mandar los datos
        env:
          PREV_USUARIO: ${{ secrets.PREV_USUARIO }}
          PREV_CLAVE: ${{ secrets.PREV_CLAVE }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          MAIL_PARA: ${{ secrets.MAIL_PARA }}
          TELEGRAM_TOKEN: ${{ (github.event_name == 'schedule' || inputs.telegram != false) && secrets.TELEGRAM_TOKEN || '' }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          WHATSAPP_DESTINOS: ${{ (github.event_name == 'schedule' || inputs.telegram != false) && secrets.WHATSAPP_DESTINOS || '' }}
          SOLO_PROBAR: ${{ inputs.solo_probar == true && '1' || '0' }}
        run: python actualizar_visitas.py

      - name: Guardar captura si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captura-error
          path: error.png
          if-no-files-found: ignore
          retention-days: 7
